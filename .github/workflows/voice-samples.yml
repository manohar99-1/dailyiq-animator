name: Voice samples

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install edge-tts kokoro-onnx soundfile numpy
      - name: Make samples
        run: python -m animator.voice_samples voice_samples
      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="voices-$(date +%Y%m%d-%H%M%S)"
          find voice_samples -size -2k -delete
          gh release create "$TAG" voice_samples/* --title "Voice samples" --notes "Listen to each file, then type the voice name : type the file name without the extension into the Generate video workflow (Kokoro files: type kokoro: and then the name, e.g. kokoro:af_bella)."
